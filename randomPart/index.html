<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランダムパート</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>
    <div id="people-select">
        <label><input type="checkbox" id="かほ" class="person-checkbox" checked>かほ</label>
        <label><input type="checkbox" id="かのん" class="person-checkbox" checked>かのん</label>
        <label><input type="checkbox" id="いつき" class="person-checkbox" checked>いつき</label>
        <label><input type="checkbox" id="たけひろ" class="person-checkbox" checked>たけひろ</label>
        <label><input type="checkbox" id="けいた" class="person-checkbox" checked>けいた</label>
        <label><input type="checkbox" id="あきと" class="person-checkbox" checked>あきと</label>
        <label><input type="checkbox" id="ひなの" class="person-checkbox" checked>ひなの</label>
        <label><input type="checkbox" id="さよ" class="person-checkbox" checked>さよ</label>
    </div>
    <input id="count" type="text" placeholder="人数を入力"><br>
    <button id="run">実行</button><br>
    <span id="error-message"></span>
    <hr>
    <div id="result-container"></div>
    <script src="./script.js"></script>
</body>

</html>
